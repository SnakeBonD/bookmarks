<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Bookmarks — gestionnaire personnel de favoris et pages de démarrage." />
  <title>Bookmarks v0.2</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon">🔖</span><span>Bookmarks</span><span class="version">v0.2</span></div>
      <div class="top-actions">
        <button id="themeToggle" class="icon-btn" title="Changer de thème">◐</button>
        <button id="toolsBtn" class="btn secondary">Outils</button>
        <button id="exportBtn" class="btn secondary">Exporter</button>
        <label class="btn secondary file-btn">Importer<input id="importInput" type="file" accept="application/json" hidden></label>
        <button id="addBookmarkBtn" class="btn primary">+ Favori</button>
      </div>
    </header>

    <section class="pagebar">
      <button id="pagesMenuBtn" class="btn secondary">☰ Pages</button>
      <div id="pageTabs" class="page-tabs"></div>
      <button id="addPageBtn" class="icon-btn" title="Nouvelle page">＋</button>
    </section>

    <section class="searchbar">
      <div class="search-wrap">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Rechercher dans les favoris…" autocomplete="off" />
        <kbd>Ctrl K</kbd>
      </div>
      <select id="scopeSelect" class="select">
        <option value="current">Page courante</option>
        <option value="all">Toutes les pages</option>
      </select>
      <select id="viewSelect" class="select">
        <option value="grid">Grille</option>
        <option value="list">Liste</option>
      </select>
    </section>

    <section id="widgets" class="widgets"></section>
    <main id="content" class="content"></main>
  </div>

  <aside id="pagesDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-head"><strong>Mes pages</strong><button id="closeDrawer" class="icon-btn">✕</button></div>
    <input id="pageSearch" class="drawer-search" placeholder="Rechercher des pages" />
    <div id="drawerPages" class="drawer-list"></div>
    <button id="drawerAddPage" class="btn primary full">Créer une nouvelle page</button>
  </aside>
  <div id="backdrop" class="backdrop"></div>

  <dialog id="bookmarkDialog" class="modal">
    <form id="bookmarkForm" method="dialog">
      <div class="modal-head"><h2 id="bookmarkDialogTitle">Ajouter un favori</h2><button type="button" class="icon-btn close-modal">✕</button></div>
      <input type="hidden" id="bookmarkId">
      <div class="form-grid">
        <label>Nom<input id="bmName" required maxlength="80"></label>
        <label>URL<input id="bmUrl" required type="url" placeholder="https://…"></label>
        <label>Page<select id="bmPage"></select></label>
        <label>Catégorie<input id="bmCategory" required placeholder="Ex. AI Tools Hub"></label>
        <label>Sous-catégorie<input id="bmSubcategory" placeholder="Ex. IMAGE"></label>
        <label>Groupe<input id="bmGroup" placeholder="Ex. Génération"></label>
        <label>Tags<input id="bmTags" placeholder="image, ai, favori"></label>
        <label>Statut<select id="bmStatus"><option>Utilisé</option><option>À tester</option><option>Archivé</option></select></label>
        <label class="wide">Description<textarea id="bmDescription" rows="3" maxlength="240"></textarea></label>
        <label class="check"><input id="bmPinned" type="checkbox"> Épingler ce favori</label>
      </div>
      <div class="modal-actions">
        <button type="button" id="deleteBookmarkBtn" class="btn danger hidden">Supprimer</button>
        <span class="spacer"></span>
        <button type="button" class="btn secondary close-modal">Annuler</button>
        <button class="btn primary" value="save">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="pageDialog" class="modal small">
    <form id="pageForm" method="dialog">
      <div class="modal-head"><h2 id="pageDialogTitle">Nouvelle page</h2><button type="button" class="icon-btn close-page-modal">✕</button></div>
      <input type="hidden" id="pageId">
      <label>Nom de la page<input id="pageName" required maxlength="50" placeholder="Ex. INFORMATIQUE"></label>
      <label>Icône<input id="pageIcon" maxlength="4" placeholder="💻"></label>
      <label id="templateLabel">Modèle
        <select id="pageTemplate">
          <option value="blank">Page vide</option>
          <option value="ai">AI Tools Hub</option>
          <option value="dev">Développement</option>
          <option value="home">Maison / Domotique</option>
        </select>
      </label>
      <div class="modal-actions">
        <button type="button" id="duplicatePageBtn" class="btn secondary hidden">Dupliquer</button>
        <button type="button" id="deletePageBtn" class="btn danger hidden">Supprimer</button>
        <span class="spacer"></span>
        <button type="button" class="btn secondary close-page-modal">Annuler</button>
        <button class="btn primary" value="save">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="toolsDialog" class="modal small">
    <div class="modal-head"><h2>Outils</h2><button type="button" id="closeTools" class="icon-btn">✕</button></div>
    <div id="toolsContent" class="tools-content"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
